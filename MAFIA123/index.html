<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#00b050">
  <meta http-equiv="refresh" content="1; url=https://mafia-kvn-game.web.app/MAFIA123">
  <title>Mafia KVN Player Join</title>
  <style>
    :root {
      --green: #00b050;
      --deep: #063d1f;
      --soft: #effaf2;
      --line: rgba(0, 176, 80, .24);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top left, rgba(0, 176, 80, .18), transparent 34rem),
        linear-gradient(135deg, #f9fff9, #e9f8ee);
      color: var(--deep);
      font-family: Georgia, "Times New Roman", serif;
    }

    main {
      width: min(92vw, 520px);
      padding: 34px 26px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: rgba(255, 255, 255, .82);
      box-shadow: 0 22px 60px rgba(8, 64, 31, .16);
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(32px, 8vw, 54px);
      letter-spacing: .04em;
    }

    p {
      margin: 10px auto;
      font-size: 18px;
      line-height: 1.5;
    }

    .code {
      display: inline-block;
      margin: 14px 0;
      padding: 10px 18px;
      border-radius: 999px;
      background: var(--soft);
      border: 1px solid var(--line);
      font: 800 22px/1.2 Georgia, "Times New Roman", serif;
      letter-spacing: .08em;
    }

    a {
      display: inline-block;
      margin-top: 18px;
      padding: 14px 22px;
      border-radius: 999px;
      background: var(--green);
      color: #fff;
      font: 700 18px/1.2 Georgia, "Times New Roman", serif;
      text-decoration: none;
      box-shadow: 0 12px 28px rgba(0, 176, 80, .24);
    }

    small {
      display: block;
      margin-top: 16px;
      color: #4f6f58;
    }
  </style>
</head>
<body>
  <main>
    <h1>Mafia KVN</h1>
    <p>Player join page</p>
    <div class="code">MAFIA123</div>
    <p>Opening the current game now. If it does not open automatically, press the button below.</p>
    <a href="https://mafia-kvn-game.web.app/MAFIA123">Join Game</a>
    <small>This permanent player link can be reused for every new game.</small>
  </main>
  <script>
    location.replace('https://mafia-kvn-game.web.app/MAFIA123');
  </script>
</body>
</html>
